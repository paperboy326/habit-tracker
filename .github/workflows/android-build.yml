name: Build Android APK

# Builds an installable APK on GitHub's runners, which have the Android SDK
# and unrestricted access to Google's Maven repo (both blocked in the
# sandboxed web dev environment). The APK is uploaded as a downloadable
# artifact and also attached to a Release when you push a tag like v1.0.0.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci || npm install

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Release build auto-bundles the JS and is signed with the bundled
      # debug keystore (see android/app/build.gradle), so the resulting APK
      # is standalone-installable on a phone without a Metro dev server.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
